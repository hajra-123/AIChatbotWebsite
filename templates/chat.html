<!-- Chatbot Embed -->
<div id="chat-widget" style="position:fixed; bottom:20px; right:20px; z-index:9999;">
  <button onclick="toggleChat()" style="background:#007bff; color:white; border:none; padding:10px 15px; border-radius:50%; cursor:pointer;">
    💬
  </button>
  <div id="chat-container" style="display:none; flex-direction:column; width:350px; height:500px; border:1px solid #ddd; border-radius:8px; background:white; box-shadow:0 4px 8px rgba(0,0,0,0.2);">
    <iframe src="https://chat.theessentialindia.com" style="width:100%; height:100%; border:none; border-radius:8px;"></iframe>
  </div>
</div>

<script>
function toggleChat() {
  const chat = document.getElementById("chat-container");
  chat.style.display = chat.style.display === "none" ? "flex" : "none";
}
</script>
